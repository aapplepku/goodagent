[project]
name = "open-commerce-backend"
version = "0.1.0rc1"
description = "Backend foundation for the Open Commerce Agent runtime."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "authlib>=1.8.0,<2",
    "cryptography>=50,<51",
    "alembic==1.14.1",
    "arq==0.26.3",
    "asyncpg==0.30.0",
    "fastapi==0.141.1",
    "starlette==1.3.1",
    "greenlet==3.5.5",
    "httpx==0.28.1",
    "pydantic-settings==2.7.1",
    "pillow>=12,<13",
    "python-multipart>=0.0.22,<1",
    "qdrant-client==1.19.0",
    "redis==5.2.1",
    "scikit-learn==1.8.0",
    "sqlalchemy==2.0.38",
    "structlog==25.1.0",
    "uvicorn[standard]==0.34.0",
]

[project.scripts]
commerce-agent = "open_commerce.cli:main"
open-commerce-api = "open_commerce.api.main:main"
open-commerce-worker = "open_commerce.worker.main:main"

[project.optional-dependencies]
learned-search = ["onnxruntime==1.29.0", "tokenizers==0.23.2"]

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"open_commerce.simulator" = ["golden_reference.json"]
"open_commerce.stores" = ["sample_data/*"]
