title = "Open Commerce Agent secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Published Python release-signing fingerprint in exact Python image metadata fields"
condition = "AND"
regexTarget = "match"
regexes = ['''^GPG_KEY=7169605F62C751356D054A26A821E680E5FA6305"$''']
paths = ['''^/data/(api|migrate|worker)\.(image-config|scan)\.json$''']

[[rules.allowlists]]
description = "Verified SHA-256 of the preserved stumpalo allocator source, not a credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^28fb0ff2e44a9804145b583160e000119c949a7368d1d9e5649c0489d8a26bc7$''']
paths = ['''(^|/)security/third-party/qdrant-1\.19\.1/manifest\.json$''']

[[rules.allowlists]]
description = "Verified public pinned MiniLM tokenizer SHA-256, not an access token"
condition = "AND"
regexTarget = "secret"
regexes = ['''^be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037$''']
paths = ['''(^|/)examples/eval/search-merchandising-v1/(development|held-out|post-fix-regression)\.json$''']

[[rules.allowlists]]
description = "Verified MiniLM tokenizer file checksum in the exact offline runtime verifier field"
condition = "AND"
regexTarget = "match"
regexes = ['''^tokenizer\.json": "be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037"$''']
paths = ['''^(?:/source/|/reports/source/)?scripts/verify_learned_search_runtime\.py$''']

[[rules.allowlists]]
description = "Two reproducible synthetic action idempotency hashes, not credentials"
condition = "AND"
regexTarget = "secret"
regexes = ['''^idem_(6c1be383d16c4021a409f58237c8459890cdc241dae46337ee972d98c160fd6b|762931103139b387fbee9aab5bd17f5ea18fb75b7597027332e5f3a47256d5c1)$''']
paths = ['''(^|/)examples/eval/merchandising-v1/summary\.json$''']

[[rules.allowlists]]
description = "Verified archive SHA-256 values in the public retention manifest, not credentials"
condition = "AND"
regexTarget = "secret"
paths = ['''^(?:/source/|/reports/source/)?infra/public-export-archives\.json$''']
